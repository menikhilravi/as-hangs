// gl.js — small WebGL2 layer: context, programs with readable errors, float targets, textures, full-screen draws.
'use strict';
const GL = (() => {
  const VS = `#version 300 es
  in vec2 p; out vec2 uv;
  void main(){ uv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
  let gl = null;

  function init(canvas) {
    gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
    if (!gl) return null;
    GL.floatRT = !!gl.getExtension('EXT_color_buffer_float');
    GL.floatLinear = !!gl.getExtension('OES_texture_float_linear');
    gl.getExtension('EXT_color_buffer_half_float');
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    GL.gl = gl; GL.tri = buf;
    return gl;
  }

  function compile(type, src, name) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS) && !gl.isContextLost()) {
      const log = gl.getShaderInfoLog(s) || '';
      const m = /0:(\d+)/.exec(log); const at = m ? +m[1] : 0;
      const lines = src.split('\n').map((l, i) => String(i + 1).padStart(4) + ' ' + l);
      console.error(`[${name}] ${log}\n` + lines.slice(Math.max(0, at - 5), at + 3).join('\n'));
      throw new Error('shader compile failed: ' + name);
    }
    return s;
  }

  // fragment source gets a standard header; `defs` is extra preamble (constants, includes)
  function program(name, fs, defs = '') {
    const head = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
in vec2 uv; layout(location = 0) out vec4 o;
${defs}
`;
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, VS, name + '.vs'));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, head + fs, name));
    gl.bindAttribLocation(p, 0, 'p');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS) && !gl.isContextLost()) { console.error(name, gl.getProgramInfoLog(p)); throw new Error('link failed: ' + name); }
    p.u = {}; p.name = name;
    return p;
  }

  function texture(w, h, { format = 'rgba32f', filter = 'linear', wrap = 'clamp', data = null } = {}) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    const F = {
      rgba32f: [gl.RGBA32F, gl.RGBA, gl.FLOAT],
      rgba16f: [gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT],
      rgba8: [gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE],
    }[format];
    gl.texImage2D(gl.TEXTURE_2D, 0, F[0], w, h, 0, F[1], F[2], data);
    const f = filter === 'linear' && (format !== 'rgba32f' || GL.floatLinear) ? gl.LINEAR : gl.NEAREST;
    const wr = wrap === 'repeat' ? gl.REPEAT : gl.CLAMP_TO_EDGE;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wr); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wr);
    t.w = w; t.h = h; t.fmt = F;
    return t;
  }
  function upload(t, data, w = t.w, h = t.h) {
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, t.fmt[1], t.fmt[2], data);
  }
  function target(w, h, opts = {}) {
    const fmt = opts.format || (GL.floatRT ? 'rgba32f' : 'rgba16f');
    const tex = texture(w, h, { ...opts, format: fmt });
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fb, w, h };
  }
  // multiple render targets: n float textures on one framebuffer
  function mrt(w, h, n, format) {
    const fmt = format || (GL.floatRT ? 'rgba32f' : 'rgba16f');
    const texs = []; const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    for (let i = 0; i < n; i++) { const t = texture(w, h, { format: fmt, filter: i === 0 ? 'linear' : 'nearest' }); texs.push(t); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0); }
    gl.drawBuffers(texs.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex: texs[0], texs, fb, w, h };
  }
  function free(t) { if (t && t.texs) { t.texs.forEach(x => gl.deleteTexture(x)); gl.deleteFramebuffer(t.fb); return; } if (!t) return; if (t.fb) gl.deleteFramebuffer(t.fb); gl.deleteTexture(t.tex || t); }

  // uniforms: number → float; {i} → int; {f:[..]} → float[]; {v2:[..]} → vec2[]; {v4:[..]} → vec4[]; 2/3/4-arrays → vecN; 9/16 → mat
  function draw(p, uniforms, tgt, vp) {
    gl.useProgram(p);
    let unit = 0;
    for (const k in uniforms) {
      let loc = p.u[k]; if (loc === undefined) loc = p.u[k] = gl.getUniformLocation(p, k);
      if (loc === null) continue;
      const v = uniforms[k];
      if (v instanceof WebGLTexture) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, v); gl.uniform1i(loc, unit++); }
      else if (v && v.tex instanceof WebGLTexture) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, v.tex); gl.uniform1i(loc, unit++); }
      else if (typeof v === 'number') gl.uniform1f(loc, v);
      else if (typeof v === 'boolean') gl.uniform1i(loc, v ? 1 : 0);
      else if (v.i !== undefined) gl.uniform1i(loc, v.i);
      else if (v.f !== undefined) gl.uniform1fv(loc, v.f);
      else if (v.v2 !== undefined) gl.uniform2fv(loc, v.v2);
      else if (v.v3 !== undefined) gl.uniform3fv(loc, v.v3);
      else if (v.v4 !== undefined) gl.uniform4fv(loc, v.v4);
      else if (v.length === 2) gl.uniform2fv(loc, v);
      else if (v.length === 3) gl.uniform3fv(loc, v);
      else if (v.length === 4) gl.uniform4fv(loc, v);
      else if (v.length === 9) gl.uniformMatrix3fv(loc, false, v);
      else if (v.length === 16) gl.uniformMatrix4fv(loc, false, v);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, tgt ? tgt.fb : null);
    if (vp) gl.viewport(vp[0], vp[1], vp[2], vp[3]);
    else gl.viewport(0, 0, tgt ? tgt.w : gl.drawingBufferWidth, tgt ? tgt.h : gl.drawingBufferHeight);
    gl.bindBuffer(gl.ARRAY_BUFFER, GL.tri);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  return { init, program, texture, upload, target, mrt, free, draw };
})();

<script>
// glsl.js — shared GLSL: constants, hashing, noise, sampling, atmosphere.
'use strict';
const GLSL = {};

GLSL.common = `
#define PI 3.14159265359
#define TAU 6.28318530718
// ---- hashing (pcg-ish), per-pixel RNG
uint pcg(uint v){ uint s = v * 747796405u + 2891336453u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
float h11(float x){ return float(pcg(floatBitsToUint(x))) / 4294967296.; }
float h21(vec2 p){ return float(pcg(floatBitsToUint(p.x) ^ pcg(floatBitsToUint(p.y)))) / 4294967296.; }
float h31(vec3 p){ return float(pcg(floatBitsToUint(p.x) ^ pcg(floatBitsToUint(p.y) ^ pcg(floatBitsToUint(p.z))))) / 4294967296.; }
uint _rs;
void rngInit(vec2 fc, int frame){ _rs = pcg(uint(fc.x) + pcg(uint(fc.y) + pcg(uint(frame) * 9781u))); }
float rnd(){ _rs = pcg(_rs); return float(_rs) / 4294967296.; }
vec2 rnd2(){ return vec2(rnd(), rnd()); }

// ---- gradient noise (3D), fbm
vec3 _g3(vec3 p){ uint h = pcg(floatBitsToUint(p.x) ^ pcg(floatBitsToUint(p.y) ^ pcg(floatBitsToUint(p.z))));
  return normalize(vec3(float(h & 1023u), float((h >> 10) & 1023u), float((h >> 20) & 1023u)) / 511.5 - 1.); }
float gnoise(vec3 p){
  vec3 i = floor(p), f = fract(p), u = f * f * f * (f * (f * 6. - 15.) + 10.);
  float n000 = dot(_g3(i), f), n100 = dot(_g3(i + vec3(1,0,0)), f - vec3(1,0,0));
  float n010 = dot(_g3(i + vec3(0,1,0)), f - vec3(0,1,0)), n110 = dot(_g3(i + vec3(1,1,0)), f - vec3(1,1,0));
  float n001 = dot(_g3(i + vec3(0,0,1)), f - vec3(0,0,1)), n101 = dot(_g3(i + vec3(1,0,1)), f - vec3(1,0,1));
  float n011 = dot(_g3(i + vec3(0,1,1)), f - vec3(0,1,1)), n111 = dot(_g3(i + vec3(1,1,1)), f - vec3(1,1,1));
  return mix(mix(mix(n000, n100, u.x), mix(n010, n110, u.x), u.y), mix(mix(n001, n101, u.x), mix(n011, n111, u.x), u.y), u.z);
}
float fbm3(vec3 p, int oct){ float s = 0., a = .5; for (int i = 0; i < 8; i++){ if (i >= oct) break; s += a * gnoise(p); p = p * 2.03 + vec3(11.7, 3.1, 7.9); a *= .5; } return s; }
// value noise 2D (cheap)
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
float fbm2(vec2 p, int oct){ float s = 0., a = .5; for (int i = 0; i < 8; i++){ if (i >= oct) break; s += a * vnoise(p); p = p * 2.07 + 13.1; a *= .5; } return s; }
// cellular: distance to nearest and second-nearest feature (2D)
vec2 cell2(vec2 p){ vec2 i = floor(p), f = fract(p); float d1 = 9., d2 = 9.;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++){ vec2 g = vec2(x, y); vec2 o = vec2(h21(i + g), h21(i + g + 17.3));
    float d = length(g + o - f); if (d < d1){ d2 = d1; d1 = d; } else if (d < d2) d2 = d; }
  return vec2(d1, d2); }

// ---- sampling
vec3 ortho(vec3 n){ return normalize(abs(n.y) < .99 ? cross(n, vec3(0,1,0)) : cross(n, vec3(1,0,0))); }
vec3 cosHemi(vec3 n, vec2 u){ float r = sqrt(u.x), a = TAU * u.y; vec3 t = ortho(n), b = cross(n, t);
  return normalize(t * r * cos(a) + b * r * sin(a) + n * sqrt(max(0., 1. - u.x))); }
vec3 cone(vec3 d, float cosMax, vec2 u){ float c = 1. - u.x * (1. - cosMax), s = sqrt(max(0., 1. - c * c)), a = TAU * u.y; vec3 t = ortho(d), b = cross(d, t);
  return normalize(t * s * cos(a) + b * s * sin(a) + d * c); }

// ---- tone mapping (AgX-like fit) and sRGB
vec3 agx(vec3 c){
  const mat3 inMat = mat3(.842479, .0423282, .0423756, .0784336, .878468, .0784336, .0792237, .0791661, .879142);
  const mat3 outMat = mat3(1.19688, -.0528968, -.0529716, -.0980208, 1.15190, -.0980434, -.0990297, -.0989612, 1.15107);
  c = inMat * max(c, 1e-10);
  c = clamp((log2(c) + 12.47393) / 16.5, 0., 1.);
  vec3 c2 = c * c, c4 = c2 * c2;
  c = 15.5 * c4 * c2 - 40.14 * c4 * c + 31.96 * c4 - 6.868 * c2 * c + .4298 * c2 + .1191 * c - .00232;
  c = outMat * c;
  return clamp(pow(max(c, 0.), vec3(2.2)), 0., 1.);
}
// hue-preserving filmic: ACES-style curve on luminance, gentle desaturation where channels would clip
vec3 filmic(vec3 c){
  c = max(c, 0.);
  float l = dot(c, vec3(.2126, .7152, .0722));
  float lt = l * (2.51 * l + .03) / (l * (2.43 * l + .59) + .14);
  vec3 r = c * (lt / max(l, 1e-6));
  float mx = max(r.r, max(r.g, r.b));
  if (mx > 1.) r = mix(r, vec3(lt), clamp((mx - 1.) / mx * 1.4, 0., 1.));
  return clamp(r, 0., 1.);
}
vec3 toSRGB(vec3 c){ return mix(c * 12.92, 1.055 * pow(c, vec3(1. / 2.4)) - .055, step(.0031308, c)); }
`;

// Single-scattering atmosphere (Nishita / Scratchapixel style), used to precompute an equirectangular sky.
GLSL.atmosphere = `
const float RE = 6360e3, RA = 6420e3, HR = 7994., HM = 1500.;
const vec3 BR = vec3(5.8e-6, 13.5e-6, 33.1e-6); const float BM = 30e-6, GMIE = .76;
const vec3 BO = vec3(.650e-6, 1.881e-6, .085e-6); // ozone absorption (Chappuis band)
float ozone(float h){ return max(0., 1. - abs(h - 25000.) / 15000.); }
vec2 raySphere(vec3 ro, vec3 rd, float r){ float b = dot(ro, rd), c = dot(ro, ro) - r * r, d = b * b - c; if (d < 0.) return vec2(1, -1); d = sqrt(d); return vec2(-b - d, -b + d); }
// returns in-scattered radiance along a ray from height h (metres), direction d; sun direction s; sunI intensity
vec3 atmo(vec3 d, vec3 s, float h, float sunI, float maxDist, out vec3 trans){
  vec3 ro = vec3(0., RE + h, 0.);
  vec2 ta = raySphere(ro, d, RA); float tEnd = ta.y;
  vec2 tg = raySphere(ro, d, RE); if (tg.x > 0.) tEnd = min(tEnd, tg.x);
  tEnd = min(tEnd, maxDist);
  const int N = 20, NL = 8;
  float seg = tEnd / float(N), odR = 0., odM = 0., odO = 0.;
  vec3 sR = vec3(0), sM = vec3(0);
  float mu = dot(d, s);
  float phR = 3. / (16. * PI) * (1. + mu * mu);
  float g2 = GMIE * GMIE; float phM = 3. / (8. * PI) * ((1. - g2) * (1. + mu * mu)) / ((2. + g2) * pow(1. + g2 - 2. * GMIE * mu, 1.5));
  for (int i = 0; i < N; i++){
    vec3 p = ro + d * (seg * (float(i) + .5));
    float hh = length(p) - RE;
    float dr = exp(-hh / HR) * seg, dm = exp(-hh / HM) * seg;
    odR += dr; odM += dm; odO += ozone(hh) * seg;
    vec2 tl = raySphere(p, s, RA); float segL = tl.y / float(NL), lR = 0., lM = 0., lO = 0.; bool shadow = false;
    for (int j = 0; j < NL; j++){ vec3 q = p + s * (segL * (float(j) + .5)); float hq = length(q) - RE; if (hq < 0.){ shadow = true; break; } lR += exp(-hq / HR) * segL; lM += exp(-hq / HM) * segL; lO += ozone(hq) * segL; }
    if (!shadow){ vec3 tau = BR * (odR + lR) + BM * 1.1 * (odM + lM) + BO * (odO + lO); vec3 att = exp(-tau); sR += att * dr; sM += att * dm; }
  }
  trans = exp(-(BR * odR + BM * 1.1 * odM + BO * odO));
  vec3 single = sR * BR * phR + sM * BM * phM;
  // multiple scattering, roughly isotropic for air but not for haze (Mie stays forward-peaked): only a little of the haze term
  vec3 multi = (sR * BR * .9 + sM * BM * .3) * (1. / (4. * PI));
  return sunI * (single + multi);
}
`;

<script>
// dust.js — puffs of limestone dust: expanding, drifting, fading Gaussian blobs, rendered analytically per frame.
'use strict';
const Dust = (() => {
  const MAX = 40, puffs = [];
  const D = { data0: new Float32Array(MAX * 4), data1: new Float32Array(MAX * 4), n: 0 };
  // x, y in stone metres (arch plane), s = strength
  function add(x, y, s = 1, z = 0) {
    const n = 2 + Math.round(s * 4);
    const low = y < 1.5;   // stones hitting the ground throw dust that rolls outward along it
    for (let k = 0; k < n; k++) {
      if (puffs.length >= MAX) puffs.shift();
      const a = Math.random() * 6.283;
      puffs.push({ x: x + Math.cos(a) * 0.4 * Math.random(), y: Math.max(0.15, y + (Math.random() - 0.4) * 0.4), z: z + Math.sin(a) * 0.7,
        r: 0.18 + 0.28 * Math.random() * Math.min(1.4, s), grow: 0.35 + 0.7 * s, rho: 0.5 * Math.min(1.5, s) * (0.5 + 0.7 * Math.random()), age: 0,
        life: 2.2 + 2.8 * Math.random() * s, seed: Math.random() * 50,
        vx: Math.cos(a) * (low ? 1.2 : 0.4) * s + 0.25, vy: (low ? 0.15 : 0.1) + 0.25 * Math.random(), vz: Math.sin(a) * (low ? 0.9 : 0.3) * s });
    }
  }
  function update(dt) {
    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i]; p.age += dt;
      if (p.age > p.life) { puffs.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vx *= 0.97; p.vz *= 0.97; p.vy *= 0.99; p.vx += 0.05 * dt;   // drag, and a light breeze from the left
      p.r += p.grow * dt * Math.exp(-p.age * 0.6);
    }
    D.n = puffs.length;
    puffs.forEach((p, i) => {
      const fade = Math.min(1, p.age / 0.15) * Math.pow(1 - p.age / p.life, 1.6);
      D.data0.set([p.x, p.y, p.z, p.r], i * 4);
      D.data1.set([p.rho * fade, p.seed, 0, 0], i * 4);
    });
    return D.n > 0;
  }
  // GLSL: integrate all puffs along a ray up to tmax; returns (in-scattered light, transmittance)
  const glsl = `
uniform vec4 uDust0[${MAX}]; uniform vec4 uDust1[${MAX}]; uniform int uNDust;
vec4 dustAlong(vec3 ro, vec3 rd, float tmax, vec3 sun, vec3 sunCol, vec3 amb){
  float tau = 0.; vec3 Ls = vec3(0);
  for (int i = 0; i < ${MAX}; i++){
    if (i >= uNDust) break;
    vec3 c = uDust0[i].xyz; float r = uDust0[i].w, rho = uDust1[i].x;
    if (rho <= 0.) continue;
    float tc = dot(c - ro, rd); vec3 cl = ro + rd * tc; float d2 = dot(cl - c, cl - c);
    if (d2 > 9. * r * r) continue;
    // a 3D Gaussian blob integrated along the line, clipped by the surface behind
    float clipT = clamp((tmax - tc) / r + .6, 0., 1.);
    float od = rho * r * 1.772 * exp(-d2 / (r * r)) * clipT;
    // lumpy: modulate by noise in the puff's own frame so it reads as billowing dust, not a ball
    vec2 q = (cl.xy - c.xy) / r * 1.6 + uDust1[i].y;
    od *= .35 + 1.3 * smoothstep(.25, .75, fbm2(q, 4));
    // light: sun through the puff (forward scattering) plus sky
    float mu = dot(rd, sun), g = .55; float ph = (1. - g * g) / (12.566 * pow(1. + g * g - 2. * g * mu, 1.5));
    vec3 col = vec3(.74, .69, .61) * (sunCol * ph * 1.2 + amb * .55);
    Ls += col * od * exp(-tau);
    tau += od;
  }
  return vec4(Ls, exp(-tau));
}`;
  return { D, add, update, glsl, MAX, puffs };
})();

// render.js — accumulation targets for each world, then the camera: exposure, lens glare (bloom), tone map, grain.
'use strict';
const Render = (() => {
  let MS = 0.7, MSB = 0.58;   // resolution of the pictures traced while a world moves (the soft, defocused room takes less); a small
  // screen can afford more
  const R = { top: null, bot: null, topM: null, botM: null, fullTop: 1, fullBot: 1, frameTop: 0, nTop: 0, nBot: 0, hdr: null, mips: [] };
  let pCombine, pDown, pUp, pFinal;

<script>
// chain.js — the hanging chain: a 2D position-based simulation in model metres (hooks on the ceiling at y = 0).
// Nodes are link joints; each segment is one link. Point loads (sacks) add mass at nodes. A finger can hold one node.
'use strict';
const Chain = (() => {
  function create({ span = 0.8, length = 1.75, pitch = 0.032, x0 = 0, y0 = -0.031, free = false } = {}) {
    const n = Math.max(8, Math.round(length / pitch));
    const seg = length / n;
    const P = new Float64Array(2 * (n + 1)), O = new Float64Array(2 * (n + 1)), M = new Float64Array(n + 1);
    const a = [x0 - span / 2, y0], b = [x0 + span / 2, y0];

      if (free) { P[2 * i] = a[0]; P[2 * i + 1] = y0 - length * t; }    // hangs straight down from its one hook
      else { P[2 * i] = a[0] + (b[0] - a[0]) * t; P[2 * i + 1] = y0 - 4 * t * (1 - t) * Math.sqrt(Math.max(0, length * length - span * span)) * 0.5; }

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>As Hangs</title>
<style>
  html,body{margin:0;height:100%;background:#0d0b09;overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block}
  #epigraph{position:fixed;left:0;right:0;bottom:calc(5vh + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:34rem;padding:0 20px;
    font:italic 400 clamp(14px,1.6vw,18px)/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:rgba(236,224,204,.86);
    text-align:center;letter-spacing:.01em;text-wrap:balance;text-shadow:0 1px 12px rgba(0,0,0,.55);opacity:0;transition:opacity 2.2s ease;pointer-events:none}
  #epigraph.on{opacity:1}
  #note{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;
    font:400 16px/1.6 "Iowan Old Style",Palatino,Georgia,serif;color:#d9ccb6;background:#0d0b09}
  body.nogl #note,body.lost #note{display:flex}
  #note .lost,body.lost #note .nogl{display:none}
  body.lost #note .lost{display:inline}
  #epigraph span{display:block;font-style:normal;font-size:.78em;letter-spacing:.12em;text-transform:uppercase;margin-top:.5em;color:rgba(236,224,204,.78)}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A stone arch on a desert plain at sunset, above a chain hanging in a lamplit room. The chain's curve, turned upside down, is the arch. Tap the chain to hang a weight, or pull it down."></canvas>
<p id="note"><span class="nogl">This piece needs a browser with WebGL 2 and floating-point render targets.<br>Try a recent Chrome, Safari, Edge or Firefox.</span><span class="lost">The graphics were interrupted. Restarting…</span></p>
<p id="epigraph">As hangs the flexible line, so but inverted will stand the rigid arch.<span>Robert Hooke, 1675</span></p>
<script src="gl.js"></script>
<script src="glsl.js"></script>
<script src="dust.js"></script>
<script src="render.js"></script>
<script src="chain.js"></script>
<script src="physics2d.js"></script>
<script src="structure.js"></script>
<script src="audio.js"></script>
<script src="stoneworld.js"></script>
<script src="workshop.js"></script>
<script src="main.js"></script>
</body>
</html>
